# Test set: one fictional invoice per scenario of docs/business-case.md, plus a compliant invoice sent as a free-form email.
# This file is used twice: to generate the invoices, then to score the extraction and the decisions.
# The "invoice" block holds the expected answer, field by field, in the shape of the Invoice model.
# The invoices themselves are in French, as a French accounts payable team would receive them.

- id: 1
  scenario: "Compliant invoice"
  format: pdf
  expected_decision: post
  expected_alerts: []
  invoice:
    supplier: "Bureau Plus SAS"
    invoice_number: "FAC-BP-2026-0311"
    invoice_date: 2026-09-14
    po_number: "PO-2026-101"
    iban: "FR7630004000031234567890143"
    lines:
      - {description: "Ramette papier A4 80 g", quantity: 50, unit_price_excl_vat: 4.20}
      - {description: "Stylo bille bleu (boîte de 50)", quantity: 4, unit_price_excl_vat: 12.50}
    total_excl_vat: 260.00
    vat_amount: 52.00
    total_incl_vat: 312.00

