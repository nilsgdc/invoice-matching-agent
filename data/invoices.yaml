    supplier: "Bureau Plus SAS"
    invoice_number: "FAC-BP-2026-0324"
    invoice_date: 2026-09-23
    po_number: null
    iban: "FR7630004000031234567890143"
    lines:
      - {description: "Chaises de bureau ergonomiques, modèle Confort", quantity: 4, unit_price_excl_vat: 189.00}
      - {description: "Lampes LED orientables pour bureau", quantity: 4, unit_price_excl_vat: 34.90}
