- id: 12
  scenario: "Compliant invoice, sent as a free-form email"
  format: email
  expected_decision: post
  expected_alerts: []
  invoice:
    supplier: "Café & Co"
    invoice_number: "CC-2026-0815"
    invoice_date: 2026-10-07
    po_number: "PO-2026-110"
    iban: "FR7618206000105678901234567"
    lines:
      - {description: "Café en grains 1 kg", quantity: 15, unit_price_excl_vat: 18.40}
      - {description: "Lait demi-écrémé (pack de 6 L)", quantity: 8, unit_price_excl_vat: 7.20}
    total_excl_vat: 333.60
    vat_amount: 66.72
    total_incl_vat: 400.32
  email_text: |
    Objet : Votre facture CC-2026-0815

    Bonjour Madame, Monsieur,

    Merci pour votre confiance ! Comme convenu, voici le détail de notre facture CC-2026-0815, datée du 7 octobre 2026, qui correspond à votre bon de commande PO-2026-110.

    Nous vous avons livré 15 paquets de café en grains de 1 kg (18,40 € HT pièce) ainsi que 8 packs de lait demi-écrémé de 6 L (7,20 € HT le pack).

    Le montant total s'élève à 333,60 € HT, soit 400,32 € TTC après 66,72 € de TVA à 20 %.

    Merci d'effectuer le virement sur notre compte habituel : FR76 1820 6000 1056 7890 1234 567.

    Belle journée,
    L'équipe Café & Co
